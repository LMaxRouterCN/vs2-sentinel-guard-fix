plugins {
    // ModDevGradle legacyforge。
    // 版本选择:2.0.116 —— 本机 modules-2 缓存里已有 moddev-gradle 2.0.116 +
    // neoform-runtime 1.0.43 + AutoRenamingTool 2.0.4 这套组合(某历史项目
    // 在本机完整跑通过);maven.neoforged.net 当下持续不可达,选缓存版本可
    // 将其从依赖链挤出去。2.0.77(TD 所钉)在本机零缓存,无亲和度。
    id 'net.neoforged.moddev.legacyforge' version '2.0.116'
}

group = 'com.lmaxrouter'
// [v1.0.1 公版热修复] 修复 v1.0.0 mixins.json package 双点 typo(见 commit 35d0371)。
// 历史:v1.0.0 为公版版本重置,handler 全参捕获规则继承自内测 v1.0.1,详见 CompatUtilMixin 注释。
// modVersion/mcVersion 为版本与文件名契约的单一事实源:modVersion=mod 语义版本(mods.toml 内 version 需与此同步);
// mcVersion=目标 MC 版本,进发布文件名(legacyForge.version 为完整 Forge 坐标,互不替代)。
def modVersion = '1.0.1'
def mcVersion = '1.20.1'
version = modVersion
base { archivesName = 'vs2-sentinel-guard-fix' }

java {
    // MC 1.20.1 Forge = Java 17;构建 JVM 本身就是 zulu-17(JAVA_HOME),
    // 工具链自匹配当前 JVM,无需下载解析器
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

tasks.withType(JavaCompile).configureEach {
    // javac 平台默认编码在中文 Windows 上是 GBK,而源文件是 UTF-8:
    // 注释里的中文会触发 "编码 GBK 的不可映射字符" 编译错误(已实踩)
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
    // mixin 注解处理器只在 Sponge maven(探测 OK)
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = uri('https://repo.spongepowered.org/repository/maven-public')
            }
        }
        filter {
            includeGroupAndSubgroups('org.spongepowered')
        }
    }
}

legacyForge {
    // 与 TD 同 Forge 行;方法级 SRG 名在整个 1.20.1 系列一致,
    // 产出 jar 兼容用户实例 47.4.x 运行时;素材走 maven.minecraftforge.net(探测 OK)
    version = '1.20.1-47.4.10'
}

dependencies {
    // mixin 注解处理器:编译期校验注解。
    // 本 mod 全部 mixin 目标都是 VS2 自己的类(remap=false),无 refmap 需求;
    // handler 方法体内的 MC 调用(getMinBuildHeight)由 reobfJar 重映射到 SRG。
    annotationProcessor 'org.spongepowered:mixin:0.8.5-SNAPSHOT:processor'

    // libs/ 下所有 jar(外层 VS2 mod jar + 从其内部提取的 JarJar 嵌套 jar):
    // 仅编译期依赖 —— 三重角色:
    // 1) mixin AP 目标校验:要求 @Mixin targets 指向的类在编译 classpath 上;
    // 2) handler 全参捕获需要 org.valkyrienskies.core.api.ships.Ship 出现在
    //    签名里 —— 该类位于 VS2 mod jar 内嵌的 JarJar 嵌套 jar(vs-core)中,
    //    Forge 运行时由 SecureJarHandler 挂载嵌套 jar,但 javac/AP 只看平铺
    //    classpath 看不到嵌套 jar(已实踩:"找不到符号: 类 Ship"),
    //    故构建前需把嵌套 jar 解出到 libs/(libs/ 已 gitignore);
    // 3) 用 fileTree 而非逐个 files():嵌套 jar 的数量/文件名不固定。
    // 生产运行时全部由实例 mods 目录提供,故 compileOnly,绝不打进产物。
    compileOnly fileTree('libs') { include '*.jar' }
}

jar {
    // reobfJar(MDG legacyforge 提供,TD 同款写法):Mojang 名 -> SRG,
    // 生产 Forge 1.20.1 运行时的方法名是 SRG(如 getMinBuildHeight -> m_141937_)
    finalizedBy 'reobfJar'
    // [v1.0.1] 发布文件名契约 {archivesName}-{modVersion}+{mcVersion}-forge.jar:
    // + 分隔 mod 版本与 MC 兼容信息(Modrinth 命名习惯);-forge 标记加载器。
    archiveFileName = "${base.archivesName.get()}-${modVersion}+${mcVersion}-forge.jar"
    manifest {
        // Forge 加载器从 manifest 的 MixinConfigs 发现 mod 的 mixin 配置。
        // 纯 manifest 注册,不依赖 mixin DSL(其来源不明,已弃用)。
        attributes 'MixinConfigs': 'vs2sentinelguardfix.mixins.json'
    }
}

// ---------------------------------------------------------------------------
// [v1.0.1] 生产 jar 命名契约 —— reobfJar 输出覆写
// 取证(2026-10-18,gradle projectsEvaluated 反射内省):MDG legacyforge 把 jar 任务
// 输出重定向到 build/devlibs(开发用 Mojang 名 jar),发布 jar 由 reobfJar 写
// build/libs,但输出文件名走插件自有约定(archivesName-version.jar),不继承
// 上方 jar.archiveFileName —— 发布链 5a 门禁曾在此拦停(+1.20.1-forge 丢失)。
// 此处显式覆写 reobfJar 输出为发布契约名,与 jar.archiveFileName 同源
// (modVersion/mcVersion 单一事实源),dev/devlibs 与 prod/libs 产物名一致。
// 实现类:net.neoforged.moddevgradle.legacyforge.tasks.RemapJar_Decorated
// ---------------------------------------------------------------------------
tasks.named('reobfJar') {
    archiveFile.set(project.file('build/libs/vs2-sentinel-guard-fix-1.0.1+1.20.1-forge.jar'))
}
// ---------------------------------------------------------------------------
// [hotfix 2026-10-17] verifyMixinConfig - 构建期 mixin 配置自洽性守卫
// 事故:mixins.json 的 package 误写为 com.lmaxrouter..mixin(双点),声明的
// CompatUtilMixin 在 jar 内不存在 -> 运行时 ClassNotFound -> prepare 阶段
// FATAL,游戏无法启动。既有两道防线都看不见它:编译期 mixin AP 只校验
// @Mixin 目标类;发布自检 javap 只验字节码签名。本任务把对账焊进 build:
// manifest 引用的配置存在、package 形态合法(双点/空段即拒)、声明的每个
// mixin 类在 jar 内真实存在——不自洽的 jar 无法完成构建。
// ---------------------------------------------------------------------------
tasks.register('verifyMixinConfig') {
    group = 'verification'
    description = '校验产物 jar 的 mixin 配置自洽性(MixinConfigs manifest / package 形态 / 声明类存在)'
    doLast {
        def libs = layout.buildDirectory.dir('libs').get().asFile
        def files = libs.listFiles() ?: []
        def jars = files.findAll { it.name.endsWith('.jar') && !it.name.endsWith('-sources.jar') }
        if (!jars) throw new GradleException('verifyMixinConfig: build/libs 为空,没有可校验的产物')
        jars.each { f ->
            new java.util.zip.ZipFile(f).withCloseable { zip ->
                // 1) manifest 声明的 MixinConfigs 必须真实存在于 jar(未声明 = mixin 永远不加载,同样是事故级)
                def cfgNames = []
                def mfEntry = zip.getEntry('META-INF/MANIFEST.MF')
                if (mfEntry != null) {
                    def manifest = new java.util.jar.Manifest(zip.getInputStream(mfEntry))
                    def declared = manifest.mainAttributes.getValue('MixinConfigs')
                    if (declared) cfgNames = declared.split(',').collect { it.trim() }.findAll { !it.empty }
                }
                if (cfgNames.isEmpty()) throw new GradleException("verifyMixinConfig: ${f.name} 的 manifest 未声明 MixinConfigs")
                cfgNames.each { name ->
                    if (zip.getEntry(name) == null) {
                        throw new GradleException("verifyMixinConfig: manifest 声明 ${name} 但 ${f.name} 内不存在")
                    }
                    // 2) package 形态守卫(双点/空段 = 本次事故直接死因)
                    def cfg = new groovy.json.JsonSlurper().parse(zip.getInputStream(zip.getEntry(name)))
                    def pkg = cfg.package
                    if (!(pkg instanceof String) || pkg.trim().isEmpty()) {
                        throw new GradleException("verifyMixinConfig: ${name} 的 package 缺失")
                    }
                    if (pkg.contains('..') || pkg.startsWith('.') || pkg.endsWith('.')) {
                        throw new GradleException("verifyMixinConfig: ${name} 的 package '${pkg}' 形态可疑(双点/空段)")
                    }
                    // 3) 声明的每个 mixin 类必须在 jar 内真实存在(mixins + client 一视同仁)
                    def classes = (cfg.mixins ?: []) + (cfg.client ?: [])
                    if (classes.isEmpty()) throw new GradleException("verifyMixinConfig: ${name} 未声明任何 mixin")
                    classes.each { cls ->
                        def path = pkg.replace('.', '/') + '/' + cls + '.class'
                        if (zip.getEntry(path) == null) {
                            throw new GradleException("verifyMixinConfig: ${name} 声明 ${pkg}.${cls} 但 ${path} 不在 jar 内")
                        }
                    }
                    logger.lifecycle("verifyMixinConfig: ${f.name} / ${name} OK(${classes.size()} 个 mixin, package=${pkg})")
                }
            }
        }
    }
}
// 挂在 build 收尾:reobf 之后、任何发布动作之前
tasks.named('build') { finalizedBy 'verifyMixinConfig' }
