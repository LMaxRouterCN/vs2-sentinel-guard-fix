plugins {
    // 与 TD 仓库同栈:ModDevGradle legacyforge
    // 职责:Forge 1.20.1 官方映射开发环境 + reobfJar(产物 Mojang->SRG 重映射)
    id 'net.neoforged.moddev.legacyforge' version '2.0.77'
}

group = 'com.lmaxrouter'
version = '1.0.0'
base { archivesName = 'vs2-sentinel-fix' }

java {
    // MC 1.20.1 Forge = Java 17;构建 JVM 本身就是 zulu-17(JAVA_HOME),
    // 工具链自匹配当前 JVM,无需 foojay 解析器(砍掉一个网络依赖)
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

repositories {
    mavenCentral()
    // mixin 注解处理器只在 Sponge maven
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = uri('https://repo.spongepowered.org/repository/maven-public')
            }
        }
        filter {
            includeGroupAndSubgroups('org.spongepowered')
        }
    }
}

legacyForge {
    // 与 TD 同版本;方法级 SRG 名在整个 1.20.1 系列一致,
    // 产出 jar 兼容用户实例 47.4.x 运行时
    version = '1.20.1-47.4.10'
}

dependencies {
    // mixin 注解处理器:编译期校验注解。
    // 本 mod 全部 mixin 目标都是 VS2 自己的类(remap=false),
    // 不需要 refmap(名称映射表);handler 方法体里的 MC 调用
    // (getMinBuildHeight)由 reobfJar 重映射到 SRG。
    annotationProcessor 'org.spongepowered:mixin:0.8.5-SNAPSHOT:processor'
}

jar {
    // reobfJar(legacyforge 提供,TD 同款写法):Mojang 名 -> SRG,
    // 生产 Forge 1.20.1 运行时的方法名是 SRG(如 getMinBuildHeight -> m_141937_)
    finalizedBy 'reobfJar'
    manifest {
        // Forge 加载器从 manifest 的 MixinConfigs 发现 mod 的 mixin 配置。
        // 纯 manifest 注册,不依赖 mixin DSL —— TD 的 mixin{} DSL 疑似来自其
        // buildSrc 自定义约定插件,来源不明,为构建链确定性直接弃用。
        attributes 'MixinConfigs': 'vs2sentinelfix.mixins.json'
    }
}