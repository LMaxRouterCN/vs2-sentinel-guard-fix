pluginManagement {
    repositories {
        gradlePluginPortal()
        // legacyforge 插件只在此仓库(TD 同配方)
        exclusiveContent {
            forRepository {
                maven {
                    name = 'NeoForged'
                    url = uri('https://maven.neoforged.net/releases')
                }
            }
            filter {
                includeGroupAndSubgroups('net.neoforged')
            }
        }
    }
}

rootProject.name = 'vs2-sentinel-fix'