[[mods]]
modId="vs2sentinelguardfix"
version="1.0.1"
displayName="VS2 Sentinel Guard Fix"
authors="LMaxRouterCN"
description='''
Fixes Valkyrien Skies 2 sentinel-coordinate biome queries: occluded ship
blocks produce an invalid marker BlockPos(0, minY-1, 0) that gets
ship-transformed into a ~24M-block drifting ghost query, stalling
synchronous BiomeSource mods (e.g. Terrain Diffusion) every tick. Guards
the shared transform funnel CompatUtil.toSameSpaceAs so below-world-floor
positions are never ship-transformed.
'''

[[dependencies.vs2sentinelguardfix]]
modId="forge"
mandatory=true
versionRange="[47,)"
ordering="NONE"
side="BOTH"

[[dependencies.vs2sentinelguardfix]]
modId="minecraft"
mandatory=true
versionRange="[1.20.1,1.21)"
ordering="NONE"
side="BOTH"

